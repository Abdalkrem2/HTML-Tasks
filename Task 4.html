<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 4</title>
</head>
<body>
    <h1>Fill in your  information</h1>
<form action="#">
    <fieldset>
    <legend>Form</legend>

    <label for="fname">First name:</label> <br>
    <input type="text" name="fname" id="fname"><br>
    
     <label for="lname">Last name:</label> <br>
    <input type="text" name="lname" id="lname"><br>

     <label for="email">Email:</label> <br>
    <input type="text" name="email" id="email"><br> <br>

    <h3>Your Gender</h3>

    <input type="radio" name="gender" value="male" id="male">
    <label for="male">Male</label> 

    <input type="radio" name="gender" value="female" id="female">
    <label for="female">Female</label>

    <h3>Favorite Subject</h3>
    <input type="checkbox" name="subject" value="C++" id="cpp"> <label for="cpp">C++</label>
    <input type="checkbox" name="subject" value="Java" id="java"> <label for="java">Java</label>
    <input type="checkbox" name="subject" value="C#" id="Csharp"> <label for="Csharp">C#</label>
    <input type="checkbox" name="subject" value="PHP" id="php"> <label for="php">PHP</label>
    <input type="checkbox" name="subject" value="SQL" id="sql"> <label for="sql">SQL</label>
    <h3>My City</h3>
    <label for="city">City:</label>
    <select name="city" id="city">
        <option value="Irbid">Irbid</option>
        <option value="Amman">Amman</option>
        <option value="Zrqa">Zrqa</option>
    </select>
    <br> <br>
    <label for="image">Upload Image:</label>
    <input type="file" id="image" name="image"><br> <br>

    <label for="about">Write About yourself:</label><br> <br>
    <textarea name="about" id="about" rows="4" cols="40" placeholder="Write Here"></textarea><br>
    <input type="submit" value="submit">



    </fieldset>
</form>
</body>
</html>
